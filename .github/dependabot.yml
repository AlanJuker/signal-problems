version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
    ignore:
      # openapi-typescript, which generates the API types, only supports TypeScript 5
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep Node's types on the version CI and Docker run (22)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
